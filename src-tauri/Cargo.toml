[package]
name = "vor"
version = "0.1.1"
edition = "2021"
description = "VOR — Visual Operations Router (Tauri v2). Marco 1: uma roda de lançamento."
authors = ["Vitor de Oliveira"]
license = "GPL-3.0-or-later"

[lib]
name = "vor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
