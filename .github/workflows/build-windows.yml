name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Chamado pelo sync-upstream (push com GITHUB_TOKEN não dispara outros workflows).
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rovyl-windows
            builder_args: --win nsis
            files: |
              build-out/Rovyl.exe
              build-out/Rovyl.exe.blockmap
              build-out/latest.yml
          - os: macos-latest
            artifact: rovyl-macos
            builder_args: --mac dmg zip --x64 --arm64
            files: |
              build-out/*.dmg
              build-out/*.zip
              build-out/*.blockmap
              build-out/latest-mac.yml
          - os: ubuntu-latest
            artifact: rovyl-linux
            builder_args: --linux AppImage deb --x64
            files: |
              build-out/*.AppImage
              build-out/*.deb
              build-out/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Linux build deps (uiohook-napi, X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxt-dev libxinerama-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxkbfile-dev
      - run: npm ci
      - run: npm run test:platform-unix
      - name: Build (vite + electron-builder, sem publicar, sem assinatura)
        shell: bash
        run: |
          npm run build
          node scripts/run-electron-builder.mjs ${{ matrix.builder_args }} --publish never
        env:
          ZENITH_BUILD_OUTPUT: build-out
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rovyl-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release (uma vez por tag, 3 SOs)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG já existe — nada a fazer."; exit 0
          fi
          ls -la dist
          for f in Rovyl.exe Rovyl.exe.blockmap latest.yml latest-mac.yml latest-linux.yml; do
            test -f "dist/$f" || { echo "faltando dist/$f"; exit 1; }
          done
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Rovyl $TAG" --generate-notes --verify-tag
