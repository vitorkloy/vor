<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>VOR</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wheel" class="zn-radial" hidden>
      <div class="zn-radial-scrim"></div>
      <div class="zn-hud" id="hud" hidden><span id="clock"></span></div>
      <div id="origin" class="zn-origin">
        <div id="sectors"></div>
        <button id="hub" class="zn-radial-hub" type="button" aria-label="Fechar">
          <svg class="hub-ring" viewBox="0 0 76 76" aria-hidden="true">
            <circle cx="38" cy="38" r="37.25" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5" />
          </svg>
          <img class="hub-mark" src="logo.svg" alt="" width="42" height="42" />
        </button>
        <div id="pill" class="zn-radial-pill">
          <span>VOR</span>
          <span class="pill-sep">/</span>
          <span id="workspace"></span>
        </div>
        <div id="label" class="zn-radial-label"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
